<svg xmlns="http://www.w3.org/2000/svg" width="396" height="456" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: #172033;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: #172033;
  font-family: Consolas, monospace;
  font-size: 16px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: #172033;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="396" height="456"></rect>
  <rect x="174" y="372" width="204" height="48" class="solid nofill" rx="0"></rect>
  <text x="207" y="402" >SVG</text>
  <text x="255" y="402" >en</text>
  <text x="291" y="402" >chat</text>
  <text x="243" y="42" >Agente</text>
  <polygon points="264,102 276,102 270,120" class="filled"></polygon>
  <text x="195" y="162" >Diagrama</text>
  <text x="303" y="162" >.bob</text>
  <polygon points="264,222 276,222 270,240" class="filled"></polygon>
  <text x="231" y="282" >svgbob</text>
  <polygon points="264,342 276,342 270,360" class="filled"></polygon>
  <g>
    <line x1="174" y1="12" x2="378" y2="12" class="solid"></line>
    <line x1="174" y1="12" x2="174" y2="60" class="solid"></line>
    <line x1="378" y1="12" x2="378" y2="60" class="solid"></line>
    <line x1="174" y1="60" x2="378" y2="60" class="solid"></line>
    <line x1="270" y1="60" x2="270" y2="102" class="solid"></line>
  </g>
  <g>
    <line x1="174" y1="132" x2="378" y2="132" class="solid"></line>
    <line x1="174" y1="132" x2="174" y2="180" class="solid"></line>
    <line x1="378" y1="132" x2="378" y2="180" class="solid"></line>
    <line x1="174" y1="180" x2="378" y2="180" class="solid"></line>
    <line x1="270" y1="180" x2="270" y2="222" class="solid"></line>
  </g>
  <g>
    <line x1="174" y1="252" x2="378" y2="252" class="solid"></line>
    <line x1="174" y1="252" x2="174" y2="300" class="solid"></line>
    <line x1="378" y1="252" x2="378" y2="300" class="solid"></line>
    <line x1="174" y1="300" x2="378" y2="300" class="solid"></line>
    <line x1="270" y1="300" x2="270" y2="342" class="solid"></line>
  </g>
</svg>