<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="360" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: #172033;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: #172033;
  font-family: Consolas, monospace;
  font-size: 16px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: #172033;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="1152" height="360"></rect>
  <rect x="810" y="12" width="324" height="120" class="solid nofill" rx="0"></rect>
  <text x="831" y="42" >3. EQUILIBRIO</text>
  <text x="831" y="66" >f(ze, tau_e) = 0</text>
  <text x="831" y="90" >phi_e = 0, tau_e = 0</text>
  <rect x="18" y="204" width="324" height="120" class="solid nofill" rx="0"></rect>
  <text x="39" y="234" >6. CONTROL</text>
  <text x="39" y="258" >tau = -K z_hat</text>
  <text x="39" y="282" >(con filtro de IMU)</text>
  <polygon points="396,78 408,84 396,90" class="filled"></polygon>
  <polygon points="792,78 804,84 792,90" class="filled"></polygon>
  <line x1="978" y1="144" x2="978" y2="174" class="solid"></line>
  <polygon points="972,174 984,174 978,192" class="filled"></polygon>
  <polygon points="360,246 348,252 360,258" class="filled"></polygon>
  <polygon points="756,246 744,252 756,258" class="filled"></polygon>
  <text x="39" y="42" >1. FISICA</text>
  <text x="435" y="42" >2. ESTADO</text>
  <text x="39" y="66" >Newton-Euler: dos</text>
  <text x="435" y="66" >z = [x v phi w]</text>
  <text x="39" y="90" >ecuaciones de segundo</text>
  <text x="435" y="90" >dz/dt = f(z, tau)</text>
  <text x="39" y="114" >orden</text>
  <text x="435" y="114" >(no lineal)</text>
  <text x="435" y="234" >5. PROPIEDADES</text>
  <text x="831" y="234" >4. LINEALIZACION</text>
  <text x="435" y="258" >polos, ceros,</text>
  <text x="831" y="258" >A = df/dz, B = df/dtau</text>
  <text x="435" y="282" >controlabilidad,</text>
  <text x="831" y="282" >dz/dt = A z + B tau</text>
  <text x="435" y="306" >observabilidad</text>
  <g>
    <line x1="18" y1="12" x2="342" y2="12" class="solid"></line>
    <line x1="18" y1="12" x2="18" y2="132" class="solid"></line>
    <line x1="342" y1="12" x2="342" y2="132" class="solid"></line>
    <line x1="342" y1="84" x2="396" y2="84" class="solid"></line>
    <line x1="18" y1="132" x2="342" y2="132" class="solid"></line>
  </g>
  <g>
    <line x1="414" y1="12" x2="738" y2="12" class="solid"></line>
    <line x1="414" y1="12" x2="414" y2="132" class="solid"></line>
    <line x1="738" y1="12" x2="738" y2="132" class="solid"></line>
    <line x1="738" y1="84" x2="792" y2="84" class="solid"></line>
    <line x1="414" y1="132" x2="738" y2="132" class="solid"></line>
  </g>
  <g>
    <line x1="414" y1="204" x2="738" y2="204" class="solid"></line>
    <line x1="414" y1="204" x2="414" y2="324" class="solid"></line>
    <line x1="738" y1="204" x2="738" y2="324" class="solid"></line>
    <line x1="360" y1="252" x2="414" y2="252" class="solid"></line>
    <line x1="414" y1="324" x2="738" y2="324" class="solid"></line>
  </g>
  <g>
    <line x1="810" y1="204" x2="1134" y2="204" class="solid"></line>
    <line x1="810" y1="204" x2="810" y2="324" class="solid"></line>
    <line x1="1134" y1="204" x2="1134" y2="324" class="solid"></line>
    <line x1="756" y1="252" x2="810" y2="252" class="solid"></line>
    <line x1="810" y1="324" x2="1134" y2="324" class="solid"></line>
  </g>
</svg>